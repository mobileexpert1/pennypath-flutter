name: Release

# Push a tag like `v1.0.0` to publish an installable Android APK (demo mode)
# on the repository's Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          --dart-define-from-file=config/mock.json

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk pennypath-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: pennypath-${{ github.ref_name }}.apk
          generate_release_notes: true
